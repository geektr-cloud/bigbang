services:
  keycloak-pg:
    container_name: keycloak-pg
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD:?error}
    volumes:
      - keycloak_pg:/var/lib/postgresql/data

  keycloak:
    container_name: keycloak
    image: ghcr.oci.anitya.net/sxxfuture/docker-images/keycloak:26.3.5-0
    restart: unless-stopped
    depends_on:
      - keycloak-pg
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-pg:5432/keycloak?user=keycloak&password=${KEYCLOAK_POSTGRES_PASSWORD:?error}&ssl=false
      - KC_HOSTNAME=https://auth.geektr.co
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KEYCLOAK_ADMIN=root
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?error}
    volumes:
      - keycloak_data:/data

volumes:
  keycloak_pg:
  keycloak_data:
